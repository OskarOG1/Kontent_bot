services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./dane:/app/dane
      - bot_api_dane:/var/lib/telegram-bot-api
    restart: unless-stopped
    cpus: "2"
    mem_limit: "3g"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot-api:
    build: ./bot-api
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot_api_dane:/var/lib/telegram-bot-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_api_dane:
